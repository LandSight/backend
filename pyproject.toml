[project]
name = "land-sight-backend"
version = "0.1.0"
description = "LandSight backend."
readme = "README.md"
license = "MIT"
authors = [
  { name = "Aleksei Shavrin", email = "apshavrinwork@gmail.com" },
  { name = "Vlad Korneev", email = "veenrok@veenrok.com" },
]
requires-python = ">=3.14"
classifiers = [ "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.14" ]
dependencies = [
  "granian>=2.6",
  "litestar>=2.19",
  "msgspec>=0.20",
  "pydantic-settings>=2.12",
]

[dependency-groups]
dev = [
  "granian[reload]>=2.6",
  { include-group = "changelog" },
  { include-group = "docs" },
  { include-group = "lint" },
  { include-group = "pre-commit" },
  { include-group = "test" },
]
test = [
  "pytest>=9.0.1",
  "pytest-cov>=7",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.1",
  "mkdocs-minify-plugin>=0.8",
]
lint = [
  "ruff>=0.14.10",
  "ty>=0.0.12",
]
pre-commit = [
  "pre-commit>=4.5.1",
]
changelog = [
  "towncrier>=25.8",
]
