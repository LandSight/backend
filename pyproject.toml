[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "land-sight-backend"
description = "LandSight backend."
readme = "README.md"
license = "MIT"
authors = [
  { name = "Aleksei Shavrin", email = "apshavrinwork@gmail.com" },
  { name = "Vlad Korneev", email = "veenrok@veenrok.com" },
]
requires-python = ">=3.14"
classifiers = [ "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.14" ]
dynamic = [ "version" ]
dependencies = [
  "pydantic-settings>=2.12",
]

[dependency-groups]
dev = [
  { include-group = "changelog" },
  { include-group = "docs" },
  { include-group = "lint" },
  { include-group = "pre-commit" },
  { include-group = "test" },
]
test = [
  "pytest>=9.0.1",
  "pytest-cov>=7",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.1",
  "mkdocs-minify-plugin>=0.8",
]
lint = [
  "ruff>=0.14.10",
  "ty>=0.0.7",
]
pre-commit = [
  "pre-commit>=4.5.1",
]
changelog = [
  "towncrier>=25.8",
]

[tool.hatch.version]
source = "code"
path = "src/app/__meta__.py"
attribute = "__version__"

[tool.hatch.build.targets.wheel]
packages = [ "src/app" ]
