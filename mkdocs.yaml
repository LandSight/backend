site_name: "Land Sight"
site_description: "Technical documentation for Land Sight"
site_author: "Land Sight"
site_dir: "build/docs"
copyright: "© 2025 LandSight"
remote_name: "origin"
repo_url: "https://github.com/LandSight/backend"
theme:
  name: "material"
  favicon: "assets/images/favicon.ico"
  logo: "assets/images/logo.png"
  features:
    - search.suggest
    - search.highlight
    - search.share
nav:
  - Home: "index.md"
  - Standarts:
    - Branching: "dev/branching.md"
    - Breaking Changes: "dev/breaking-change.md"
    - "Changelog Policy": "dev/changelog-policy.md"
    - "Code Style": "dev/code-style.md"
    - "Commit Style": "dev/commit-style.md"
    - "Issues": "dev/issues.md"
    - "Pull Requests": "dev/pull-request.md"
    - "Testing": "dev/testing.md"
  - Contributing: "contributing.md"
  - Changelog: "changelog.md"
plugins:
  - "search"
  - "optimize"
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
