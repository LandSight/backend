services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: landsight-postgres
    environment:
      POSTGRES_DB: landsight
      POSTGRES_USER: landsight
      POSTGRES_PASSWORD: landsight
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landsight -d landsight"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: landsight-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - landsight-network

volumes:
  pgdata:
  minio_data:

networks:
  landsight-network:
    driver: bridge
