# HMCDA engine configuration.
#
# Profiles are keyed by analysis type; each profile owns its hierarchy and its
# fuzzy functions. Metric keys are canonical: topography and climate metrics use
# their own key, infrastructure metrics are namespaced as "<category>:<metric>".
engine: hmcda
key: baseline
name: Fuzzy Hierarchical MCDA
description: Baseline engine based on fuzzy hierarchical multi-criteria analysis
model_version: v2.0

profiles:
  izhs:
    hierarchy:
      clusters:
        - key: relief
          name: Relief
          weight: 0.20
          components:
            - key: slope
              name: Slope
              weight: 0.50
              components:
                - { key: mean_slope, weight: 0.30 }
                - { key: max_slope, weight: 0.20 }
                # Upper percentiles describe the worst terrain of the parcel;
                # lower ones repeat the mean and are not collected.
                - { key: slope_p75, weight: 0.20 }
                - { key: slope_p90, weight: 0.30 }
            # Elevation spread only: the range repeats the slope picture.
            - key: elevation
              name: Elevation
              weight: 0.15
              components:
                - { key: elevation_std, weight: 1.0 }
            - key: shape
              name: Plot shape
              weight: 0.35
              components:
                - { key: area, weight: 0.30 }
                - { key: compactness_index, weight: 0.40 }
                - { key: elongation_index, weight: 0.30 }

        - key: climate
          name: Climate
          weight: 0.08
          components:
            - key: temperature
              name: Temperature
              weight: 0.50
              components:
                - { key: mean_annual_temperature, weight: 0.30 }
                - { key: min_temperature_coldest_month, weight: 0.40 }
                - { key: max_temperature_warmest_month, weight: 0.30 }
            - key: precipitation
              name: Precipitation
              weight: 0.50
              components:
                - { key: annual_precipitation, weight: 0.50 }
                - { key: precipitation_driest_month, weight: 0.50 }

        - key: infrastructure
          name: Infrastructure
          weight: 0.35
          components:
            - key: facility
              name: Facilities and services
              weight: 0.45
              components:
                - { key: "hospital:min_distance_to", weight: 0.15 }
                - { key: "pharmacy:min_distance_to", weight: 0.10 }
                - { key: "grocery:count", weight: 0.10 }
                - { key: "grocery:min_distance_to", weight: 0.20 }
                - { key: "bus_stop:count", weight: 0.10 }
                - { key: "bus_stop:min_distance_to", weight: 0.20 }
                - { key: "railway_station:min_distance_to", weight: 0.05 }
                - { key: "police:min_distance_to", weight: 0.05 }
                - { key: "fire_station:min_distance_to", weight: 0.05 }
            - key: utility
              name: Utility networks
              weight: 0.10
              components:
                # Distribution lines are a connection opportunity. Transmission
                # lines are a building constraint, handled by the restriction
                # zones rather than scored here.
                - { key: "power_line:distance_to_distribution_line", weight: 0.50 }
                - { key: "water_source:min_distance_to", weight: 0.30 }
                - { key: "water_source:count", weight: 0.20 }
            - key: road_accessibility
              name: Road accessibility
              weight: 0.45
              components:
                - { key: "road_accessibility:distance_to_paved_road", weight: 0.40 }
                - { key: "road_accessibility:distance_to_main_road", weight: 0.20 }
                - { key: "road_accessibility:distance_to_any_road", weight: 0.20 }
                - { key: "road_accessibility:road_density_1km", weight: 0.20 }

        # Weighted up so that a plot near a forest, a lake or a river stands out
        # from one in the middle of a built-up area.
        - key: ecology_recreation
          name: Ecology and Recreation
          weight: 0.25
          components:
            - { key: "forest:coverage_ratio", weight: 0.25 }
            - { key: "forest:min_distance_to", weight: 0.10 }
            - { key: "water_body:coverage_ratio", weight: 0.15 }
            - { key: "water_body:river_density", weight: 0.10 }
            - { key: "water_body:min_distance_to", weight: 0.10 }
            - { key: "water_body:distance_to_large_object", weight: 0.15 }
            - { key: "protected_area:min_distance_to", weight: 0.15 }

        - key: geographic_position
          name: Geographical location
          weight: 0.12
          components:
            - { key: "geographic_position:distance_to_settlement", weight: 0.50 }
            - { key: "geographic_position:distance_to_district_center", weight: 0.30 }
            - { key: "geographic_position:distance_to_regional_center", weight: 0.20 }

    # Restriction zones (see the restriction module and docs/restrictions.md).
    # The breakdown above says how good a plot is; constraints say what the
    # law or the surroundings rule out for a house:
    #   prohibit  total score 0 once the zone covers at least min_share of the
    #             plot; a smaller overlap falls back to the penalty, if any
    #   penalty   score multiplied by (1 - penalty); with scale_by_share the
    #             penalty is weighted by the covered share, for zones that only
    #             rule out the covered part of the plot
    # min_share above 0 absorbs OSM digitizing error at shared boundaries.
    constraints:
      # Building is barred inside.
      protected_area: { effect: prohibit, min_share: 0.1, penalty: 0.5, scale_by_share: true }
      military: { effect: prohibit, min_share: 0.05, penalty: 0.5, scale_by_share: true }
      prison: { effect: prohibit, min_share: 0.05, penalty: 0.5, scale_by_share: true }
      airfield: { effect: prohibit, min_share: 0.05, penalty: 0.5, scale_by_share: true }
      cemetery: { effect: prohibit, min_share: 0.05, penalty: 0.5, scale_by_share: true }
      landfill: { effect: prohibit, min_share: 0.05, penalty: 0.5, scale_by_share: true }
      industrial: { effect: prohibit, min_share: 0.3, penalty: 0.5, scale_by_share: true }
      # Public land or water: the plot is drawn over it.
      road_body: { effect: prohibit, min_share: 0.1, penalty: 0.5, scale_by_share: true }
      railway_strip: { effect: prohibit, min_share: 0.1, penalty: 0.5, scale_by_share: true }
      water_body: { effect: prohibit, min_share: 0.3, penalty: 0.6, scale_by_share: true }
      # Protection zones of networks: no house inside; a covered corner only
      # shrinks the buildable area.
      power_line_zone: { effect: prohibit, min_share: 0.5, penalty: 0.6, scale_by_share: true }
      trunk_pipeline_zone: { effect: prohibit, min_share: 0.3, penalty: 0.6, scale_by_share: true }
      gas_distribution_zone: { effect: prohibit, min_share: 0.5, penalty: 0.4, scale_by_share: true }
      # Parts of the plot that cannot be built on or fenced.
      shore_strip: { effect: penalty, penalty: 0.3, scale_by_share: true }
      coastal_protection_strip: { effect: penalty, penalty: 0.2, scale_by_share: true }
      wetland: { effect: penalty, penalty: 0.5, scale_by_share: true }
      # Nuisance and sanitary buffers: they affect the whole plot.
      landfill_szz: { effect: penalty, penalty: 0.5 }
      cemetery_szz: { effect: penalty, penalty: 0.3 }
      trunk_pipeline_min_distance: { effect: penalty, penalty: 0.3 }
      railway_sanitary_gap: { effect: penalty, penalty: 0.25 }
      wastewater_szz: { effect: penalty, penalty: 0.25 }
      industrial_buffer: { effect: penalty, penalty: 0.15 }
      airfield_vicinity: { effect: penalty, penalty: 0.15 }
      roadside_strip: { effect: penalty, penalty: 0.1 }
      protected_area_buffer: { effect: penalty, penalty: 0.1 }
      prison_buffer: { effect: penalty, penalty: 0.1 }
      # Building is allowed, but only with a sewage treatment system.
      water_protection_zone: { effect: penalty, penalty: 0.05 }

    functions:
      # Relief - slope
      mean_slope:
        type: z_shaped
        params: { optimal_max: 2, acceptable_max: 15 }
        unit: deg
      max_slope:
        type: z_shaped
        params: { optimal_max: 5, acceptable_max: 25 }
        unit: deg
      slope_p75:
        type: z_shaped
        params: { optimal_max: 3, acceptable_max: 15 }
        unit: deg
      slope_p90:
        type: z_shaped
        params: { optimal_max: 5, acceptable_max: 20 }
        unit: deg
      # Relief - elevation
      elevation_std:
        type: z_shaped
        params: { optimal_max: 1, acceptable_max: 10 }
        unit: m
      # Relief - shape
      area:
        type: trapezoidal
        params: { low: 200, optimal_min: 600, optimal_max: 2000, high: 5000 }
        unit: m2
      # Compactness relative to a square: 1 = square, 0.89 = 1:2 rectangle.
      compactness_index:
        type: s_shaped
        params: { min: 0.5, max: 0.85 }
      # Width to length ratio: 1:2 or squarer is optimal, 1:5 is unusable.
      elongation_index:
        type: s_shaped
        params: { min: 0.2, max: 0.5 }
      # Climate - temperature
      mean_annual_temperature:
        type: trapezoidal
        params: { low: -5, optimal_min: 3, optimal_max: 7, high: 15 }
        unit: degC
      min_temperature_coldest_month:
        type: s_shaped
        params: { min: -30, max: -10 }
        unit: degC
      max_temperature_warmest_month:
        type: trapezoidal
        params: { low: 10, optimal_min: 20, optimal_max: 25, high: 35 }
        unit: degC
      # Climate - precipitation
      annual_precipitation:
        type: trapezoidal
        params: { low: 300, optimal_min: 500, optimal_max: 700, high: 1000 }
        unit: mm
      precipitation_driest_month:
        type: s_shaped
        params: { min: 5, max: 30 }
        unit: mm
      # Facility - healthcare
      "hospital:min_distance_to":
        type: z_shaped
        params: { optimal_max: 1000, acceptable_max: 5000 }
        unit: m
      "pharmacy:min_distance_to":
        type: z_shaped
        params: { optimal_max: 500, acceptable_max: 2000 }
        unit: m
      # Facility - retail
      "grocery:count":
        type: s_shaped
        params: { min: 0, max: 3 }
      "grocery:min_distance_to":
        type: z_shaped
        params: { optimal_max: 300, acceptable_max: 1000 }
        unit: m
      # Facility - transport
      "bus_stop:count":
        type: s_shaped
        params: { min: 0, max: 5 }
      "bus_stop:min_distance_to":
        type: z_shaped
        params: { optimal_max: 300, acceptable_max: 1000 }
        unit: m
      "railway_station:min_distance_to":
        type: z_shaped
        params: { optimal_max: 2000, acceptable_max: 10000 }
        unit: m
      # Facility - safety
      "police:min_distance_to":
        type: z_shaped
        params: { optimal_max: 2000, acceptable_max: 10000 }
        unit: m
      "fire_station:min_distance_to":
        type: z_shaped
        params: { optimal_max: 2000, acceptable_max: 10000 }
        unit: m
      # Ecology - water. Area densities are hectares of the objects per square
      # kilometre of the 2 km ring around the parcel.
      "water_body:coverage_ratio":
        type: s_shaped
        params: { min: 1, max: 10 }
        unit: ha/km2
      # One river crossing the 2 km ring is about 0.3 km/km2.
      "water_body:river_density":
        type: s_shaped
        params: { min: 0, max: 0.3 }
        unit: km/km2
      # Closer is better: the Water Code allows houses in the water protection
      # zone, only the 20 m shore strip (5 m for small rivers) is public.
      "water_body:min_distance_to":
        type: z_shaped
        params: { optimal_max: 500, acceptable_max: 2000 }
        unit: m
        missing_value: 2000
      # Lake or reservoir of 100 ha and more, within the 2 km search buffer.
      "water_body:distance_to_large_object":
        type: z_shaped
        params: { optimal_max: 1000, acceptable_max: 2000 }
        unit: m
        missing_value: 2000
      # Ecology - forest
      "forest:coverage_ratio":
        type: s_shaped
        params: { min: 5, max: 30 }
        unit: ha/km2
      "forest:min_distance_to":
        type: z_shaped
        params: { optimal_max: 500, acceptable_max: 2000 }
        unit: m
        missing_value: 2000
      # Ecology - protected areas. Up to 3 km is optimal (nature nearby,
      # nothing will be built there), farther fades out, none within 10 km
      # scores 0. Building inside one is barred by its regime; that is the
      # protected_area restriction, so the edge itself is not penalised here.
      "protected_area:min_distance_to":
        type: z_shaped
        params: { optimal_max: 3000, acceptable_max: 10000 }
        unit: m
        missing_value: 10000
      # Distribution lines (below 35 kV): a grid connection at the discounted
      # rate needs one within 300 m in towns and 500 m in rural areas. Sparse
      # in OSM, so a missing line stays unscored.
      "power_line:distance_to_distribution_line":
        type: z_shaped
        params: { optimal_max: 300, acceptable_max: 1000 }
        unit: m
      # Water sources (wells, springs, taps). Sparse in OSM, so a missing
      # source stays unscored instead of counting against the plot.
      "water_source:min_distance_to":
        type: z_shaped
        params: { optimal_max: 300, acceptable_max: 1500 }
        unit: m
      "water_source:count":
        type: s_shaped
        params: { min: 0, max: 3 }
      # Roads
      "road_accessibility:distance_to_paved_road":
        type: z_shaped
        params: { optimal_max: 500, acceptable_max: 5000 }
        unit: m
      "road_accessibility:distance_to_main_road":
        type: z_shaped
        params: { optimal_max: 2000, acceptable_max: 20000 }
        unit: m
      "road_accessibility:distance_to_any_road":
        type: z_shaped
        params: { optimal_max: 200, acceptable_max: 2000 }
        unit: m
      "road_accessibility:road_density_1km":
        type: trapezoidal
        params: { low: 0.2, optimal_min: 1, optimal_max: 3, high: 6 }
        unit: km/km2
      # Geographic position
      "geographic_position:distance_to_regional_center":
        type: z_shaped
        params: { optimal_max: 20000, acceptable_max: 150000 }
        unit: m
      "geographic_position:distance_to_district_center":
        type: z_shaped
        params: { optimal_max: 5000, acceptable_max: 50000 }
        unit: m
      "geographic_position:distance_to_settlement":
        type: z_shaped
        params: { optimal_max: 1000, acceptable_max: 10000 }
        unit: m
