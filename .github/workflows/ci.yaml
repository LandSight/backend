name: "CI"
on:
  push:
    branches:
      - develop
      - hotfix/*
  pull_request:
    branches:
      - main
      - develop
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Run linter checks
        run: make check-lint

      - name: Run format checks
        run: make check-fmt
